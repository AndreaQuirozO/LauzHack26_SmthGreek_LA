[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-calc-onboarding-assistant"
version = "0.1.0"
description = "A source-grounded local demo for enterprise software migration assistance."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.124.4,<0.125",
    "httpx>=0.27,<0.29",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json", "static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"